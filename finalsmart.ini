[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果
;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/jackieyiwu/openclashcfg/refs/heads/main/rules/Custom_Direct_Domain.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://raw.githubusercontent.com/jackieyiwu/openclashcfg/refs/heads/main/rules/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 手动选择,clash-domain:https://raw.githubusercontent.com/jackieyiwu/openclashcfg/refs/heads/main/rules/Custom_Proxy_Domain.yaml,28800
;谷歌在国内可用的域名直连
##ruleset=🎯 全球直连,[]GEOSITE,google-cn
;国内游戏域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
;Steam 下载 CDN 直连
ruleset=🎯 全球直连,clash-classic:https://raw.githubusercontent.com/jackieyiwu/openclashcfg/refs/heads/main/rules/Steam_CDN_Classical.yaml,28800
;各大游戏平台下载域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
;BT Tracker 相关域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
;即时通讯包括了 Telegram/WhatsApp/Line 等海外主流即时通讯软件域名
ruleset=💬 即时通讯,[]GEOSITE,category-communication
;社交媒体包括了 Twitter(X)/Facebook/Instagram 等海外主流社交媒体
ruleset=🪩 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=🤖 AI服务,[]GEOSITE,openai
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
ruleset=📋️ GitHub,[]GEOSITE,github
ruleset=🍁 华为云,[]GEOSITE,huaweicloud
ruleset=☁️ CloudFlareCDN,https://raw.githubusercontent.com/jackieyiwu/openclashcfg/refs/heads/main/rules/CloudflareCIDR.list
ruleset=💰 数字货币,[]GEOSITE,category-cryptocurrency 
;测速工具包括 SpeedTest 等主流测速工具域名
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🎥 流媒体,[]GEOSITE,apple-tvplus
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=📢 谷歌FCM,[]GEOSITE,googlefcm
ruleset=🇬 谷歌服务,[]GEOSITE,google
ruleset=🎶 TikTok,[]GEOSITE,tiktok
ruleset=🎥 流媒体,[]GEOSITE,netflix
ruleset=🎥 流媒体,[]GEOSITE,disney
ruleset=🎥 流媒体,[]GEOSITE,hbo
ruleset=🎥 流媒体,[]GEOSITE,primevideo
;Emby 包括主流 Emby 服务相关域名
ruleset=🎥 流媒体,[]GEOSITE,category-emby
ruleset=🎻 Spotify,[]GEOSITE,spotify
ruleset=🎥 流媒体,[]GEOSITE,bahamut
ruleset=🎮 游戏平台,[]GEOSITE,category-games
ruleset=🪩 社交媒体,[]GEOSITE,category-entertainment
ruleset=🪩 社交媒体,[]GEOSITE,category-ecommerce
ruleset=🪩 社交媒体,[]GEOSITE,x
ruleset=🪩 社交媒体,[]GEOIP,twitter,no-resolve
ruleset=🪩 社交媒体,[]GEOIP,facebook,no-resolve
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=💬 即时通讯,[]GEOIP,telegram,no-resolve
ruleset=🇬 谷歌服务,[]GEOIP,google,no-resolve
ruleset=🎥 流媒体,[]GEOIP,netflix,no-resolve
;男人的爱好
ruleset=🤷 Nsfw,clash-classic:https://raw.githubusercontent.com/jackieyiwu/openclashcfg/refs/heads/main/rules/nsfwlist.yaml,28800
ruleset=🤷 Nsfw,[]GEOSITE,category-porn
ruleset=💏 Doppiocdn,clash-classic:https://raw.githubusercontent.com/jackieyiwu/openclashcfg/refs/heads/main/rules/doppiocdn.yaml,28800
;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geosite:cn 作为国内域名兜底
ruleset=🎯 全球直连,[]GEOSITE,cn
;由于 OpenClash 使用的大陆白名单收录不全，此处留有 geoip:cn 作为国内 IP 兜底
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
;以上兜底规则会根据实际情况随时取消
;PT/BT 优化开启会使 80/443 以外端口的流量直连
ruleset=🔀 非标端口,https://raw.githubusercontent.com/jackieyiwu/openclashcfg/refs/heads/main/rules/Custom_Port_Direct.yaml,28800
;国内冷门域名会命中漏网之鱼，如影响使用，请设置漏网之鱼直连
;漏网之鱼直连时，无法通过 DNS 泄露测试，但是并不存在泄露
ruleset=🐟 漏网之鱼,[]FINAL

;设置节点分组标志位
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`.*
